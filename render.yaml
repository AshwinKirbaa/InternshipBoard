services:
  - type: web
    name: internship-board-api
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: npm run start:api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGINS
        value: https://internship-board.vercel.app,http://localhost:3000,http://127.0.0.1:3000
